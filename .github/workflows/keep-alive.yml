name: Keep Alive Ping

on:
  schedule:
    # Run once daily at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API
        run: |
          # Check if SITE_URL secret is set
          if [ -z "${{ secrets.SITE_URL }}" ]; then
            echo "ERROR: SITE_URL secret is not set"
            exit 1
          fi

          SITE_URL="${{ secrets.SITE_URL }}"
          echo "Pinging: ${SITE_URL}/api/ping"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Retry logic for cold starts (serverless platforms may need warm-up time)
          MAX_RETRIES=3
          RETRY_DELAY=10
          ATTEMPT=1
          SUCCESS=0

          while [ $ATTEMPT -le $MAX_RETRIES ]; do
            echo "Attempt $ATTEMPT of $MAX_RETRIES..."

            # Use curl with proper timeout handling
            HTTP_CODE=$(curl -s -o /tmp/ping_response.json -w "%{http_code}" \
              --max-time 60 \
              --connect-timeout 30 \
              --retry 2 \
              --retry-delay 5 \
              "${SITE_URL}/api/ping" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "Ping successful! HTTP Status: $HTTP_CODE"
              echo "Response:"
              cat /tmp/ping_response.json 2>/dev/null | head -20 || echo "(No response body)"
              SUCCESS=1
              break
            else
              echo "Attempt $ATTEMPT failed with HTTP Status: $HTTP_CODE"
              if [ -f /tmp/ping_response.json ]; then
                echo "Response:"
                cat /tmp/ping_response.json | head -20
              fi

              if [ $ATTEMPT -lt $MAX_RETRIES ]; then
                echo "Waiting ${RETRY_DELAY}s before retry..."
                sleep $RETRY_DELAY
              fi
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ $SUCCESS -eq 1 ]; then
            echo "Keep-alive ping completed successfully"
            exit 0
          else
            echo "All retry attempts failed"
            exit 1
          fi
